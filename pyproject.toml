[project]
name = "db-delay-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MertAkguel", email = "mert_akguel@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.107",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
db-delay-mlops = "db_delay_mlops:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "xgboost>=3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # "uv run pytest" looks only here, not in notebooks/ or data/

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "*.md"]  # exploration and docs, not production code

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors
    "F",  # pyflakes: unused imports, undefined names
    "I",  # isort: sorted imports
    "B",  # bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
]
