# Local stack: Airflow 3 (LocalExecutor) + Postgres + MLflow + prediction API + Streamlit demo.
#
# Start:  make up   (creates the folders below, then: docker compose up -d --build)
# UI:     Airflow http://localhost:8080, MLflow http://localhost:5000, API http://localhost:8000/docs,
#         demo http://localhost:8501
# Stop:   docker compose down          (data stays: Postgres volume, ./data, ./mlflow_store)

# Shared settings for every Airflow container. "&airflow-common" names this block,
# "<<: *airflow-common" pastes it into a service below (YAML anchors, so nothing is repeated).
x-airflow-common: &airflow-common
  build: .
  image: db-delay-airflow:dev
  # Run as your WSL user (id -u), so files written to ./data and ./logs belong to you
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Airflow 3: tasks report their state to the API server over HTTP
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # All Airflow containers must sign and check task tokens with the same secret
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-secret
    # Local only: no login page, everyone is admin. Never like this on a server.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Our pipeline steps log to the MLflow container, not to localhost
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # The DAG tells the API to load a new champion (task reload_api)
    API_URL: http://api:8000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/pipeline/data
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  # Airflow's memory: DAG runs, task states, schedules
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # One-off job: creates or upgrades Airflow's tables, then exits
  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  # Web UI and the API the tasks talk to
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Decides which task runs when, and starts it (LocalExecutor: as a process in this container)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started

  # Reads the files in ./dags and stores the parsed DAGs in the database
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Tracking server and model registry. Uses the mlflow from our image, so server and
  # client have the same version. Keeps your existing runs and models (./mlflow_store).
  mlflow:
    build: .  # same image as Airflow; "build" so a fresh clone does not try to download it
    image: db-delay-airflow:dev
    user: "${AIRFLOW_UID:-1000}:0"
    entrypoint: /opt/pipeline/.venv/bin/mlflow
    command:
      - server
      - --backend-store-uri=sqlite:////mlflow_store/mlflow.db
      - --artifacts-destination=/mlflow_store/mlartifacts
      - --host=0.0.0.0
      - --port=5000
      # Containers call it "mlflow:5000", your browser "localhost:5000"
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_store:/mlflow_store
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: always

  # Prediction API: loads models:/db-delay-lightgbm@champion at start-up
  # and again on POST /reload (the DAG calls it after a new champion).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: db-delay-api:dev
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./data/predictions:/app/data/predictions  # D6: every prediction, read by the monitoring
    depends_on:
      mlflow:
        condition: service_healthy  # no model without MLflow
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # Streamlit demo: tomorrow's arrivals at a station with their delay risk (http://localhost:8501).
  # Same image as the API; it only talks to the API over HTTP and never loads the model itself.
  demo:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: db-delay-api:dev
    command:
      ["streamlit", "run", "src/db_delay_mlops/demo/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    env_file:
      - path: .env  # DB_CLIENT_ID and DB_API_KEY for the timetable; without them the demo has a manual form
        required: false
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  postgres-db:
